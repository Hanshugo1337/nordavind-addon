name: Package and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create addon zip
        run: |
          zip -r NordavindLC-${{ steps.version.outputs.version }}.zip NordavindLC/ \
            -x "NordavindLC/.*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NordavindLC-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Get release notes
        id: notes
        run: |
          gh release view "${{ steps.version.outputs.version }}" --json body -q .body > release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          CHANGELOG=$(cat release_notes.md)
          jq -n \
            --arg changelog "$CHANGELOG" \
            --arg name "NordavindLC ${{ steps.version.outputs.version }}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $name,
              gameVersions: [14422],
              releaseType: "release"
            }' > metadata.json

          # `curl -s` uten `-f` gir exit 0 ogsaa paa HTTP 500, og et `run:`-steg
          # ser bare exit-koden. Det slo til 01.09.2026: CurseForge svarte
          # {"errorCode":500} etter 30 sekunder, jobben ble groenn paa 43 s, og
          # v1.9.5 laa aldri ute. Feilen ble foerst oppdaget kvelden 02.09, da
          # hele testplanen forutsatte at alle raiderne hadde versjonen.
          #
          # Fasit er derfor SVARET, ikke exit-koden: en publisert fil har en id.
          # Sjekken maa daekke tre former for loegn - feilkode i kroppen, en
          # HTTP-kode som ikke er 200, og et tomt svar fra et brutt kall.
          SVAR=$(curl -s -w '\n%{http_code}' -X POST \
            "https://wow.curseforge.com/api/projects/1499638/upload-file" \
            -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<metadata.json;type=application/json" \
            -F "file=@NordavindLC-${{ steps.version.outputs.version }}.zip")
          KODE=$(tail -n1 <<<"$SVAR")
          KROPP=$(sed '$d' <<<"$SVAR")
          echo "$KROPP"
          if [ "$KODE" != "200" ] || ! grep -qE '"id"[[:space:]]*:[[:space:]]*[0-9]+' <<<"$KROPP"; then
            echo "::error::CurseForge avviste opplastinga (HTTP $KODE) - filen er IKKE publisert"
            exit 1
          fi
          echo "CurseForge-fil publisert: $KROPP"
